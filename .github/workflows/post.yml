name: ICFINANCE Instagram Post

on:
  workflow_dispatch:
    inputs:
      session:
        description: "open or close"
        required: true
        default: "open"
        type: choice
        options: [open, close]
  schedule:
    # 16:30 Israel time (IDT, UTC+3) -> 13:30 UTC. Update if Israel DST changes.
    - cron: "30 13 * * 1-5"
    # 23:00 Israel time (IDT, UTC+3) -> 20:00 UTC. Update if Israel DST changes.
    - cron: "0 20 * * 1-5"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine session
        id: session
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "session=${{ inputs.session }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 13 * * 1-5" ]; then
            echo "session=open" >> "$GITHUB_OUTPUT"
          else
            echo "session=close" >> "$GITHUB_OUTPUT"
          fi

      - name: Render image + caption
        id: render
        run: |
          mkdir -p posts
          DATE=$(date -u +%F)
          SESSION="${{ steps.session.outputs.session }}"
          OUT="posts/${DATE}-${SESSION}.jpg"
          python3 render.py "$SESSION" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Commit and push generated image
        run: |
          git config user.name "icfinance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.render.outputs.out }}" "${{ steps.render.outputs.out }}.caption.txt"
          git commit -m "Post: ${{ steps.render.outputs.out }}"
          git push

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.render.outputs.out }}"
          python3 publish.py "$RAW_URL" "${{ steps.render.outputs.out }}.caption.txt"
