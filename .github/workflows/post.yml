name: ICFINANCE Instagram Post

on:
  workflow_dispatch:
    inputs:
      session:
        description: "open or close"
        required: true
        default: "open"
        type: choice
        options: [open, close]
  # schedule: PAUSED on 2026-09-17 - every automatic run since ~Sep 9 has
  # failed at the "Publish to Instagram" step with the same "API access
  # blocked" error (see logs/publish-failure-*.log), which was spamming
  # failure-notification emails without actually posting anything. Re-enable
  # (uncomment) only after a manual workflow_dispatch run has been confirmed
  # to actually publish successfully.
  # schedule:
  #   # 16:40 Israel time (IDT, UTC+3) -> 13:40 UTC.
  #   - cron: "40 13 * * 1-5"
  #   # 23:00 Israel time (IDT, UTC+3) -> 20:00 UTC.
  #   - cron: "0 20 * * 1-5"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine session
        id: session
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "session=${{ inputs.session }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 13 * * 1-5" ]; then
            echo "session=open" >> "$GITHUB_OUTPUT"
          else
            echo "session=close" >> "$GITHUB_OUTPUT"
          fi

      - name: Render image + caption
        id: render
        run: |
          mkdir -p posts
          DATE=$(date -u +%F)
          SESSION="${{ steps.session.outputs.session }}"
          OUT="posts/${DATE}-${SESSION}.jpg"
          python3 render.py "$SESSION" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Commit and push generated image
        run: |
          git config user.name "icfinance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.render.outputs.out }}" "${{ steps.render.outputs.out }}.caption.txt"
          git commit -m "Post: ${{ steps.render.outputs.out }}" || echo "Nothing new to commit (file already exists from an earlier run today) - continuing, it's still publicly reachable"
          git push

      - name: Publish to Instagram
        id: publish
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set +e
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.render.outputs.out }}"
          python3 publish.py "$RAW_URL" "${{ steps.render.outputs.out }}.caption.txt" > publish_output.log 2>&1
          EXIT_CODE=$?
          set -e
          cat publish_output.log
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Save publish log on failure
        if: steps.publish.outputs.exit_code != '0'
        run: |
          mkdir -p logs
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          cp publish_output.log "logs/publish-failure-${STAMP}.log"
          git config user.name "icfinance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/
          git commit -m "Debug: log publish failure ${STAMP}"
          git pull --rebase
          git push

      - name: Fail job if publish failed
        if: steps.publish.outputs.exit_code != '0'
        run: exit 1
